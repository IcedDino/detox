name: detox
description: Detox app MVP with real Android usage tracking.
publish_to: 'none'
version: 1.1.3+5

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.2.0
  intl: ^0.20.2
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_local_notifications: ^22.3.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Generated from docs/legal/*.md by docs/legal/generar.py. The app renders
    # these natively so a legal link never sends the user to a browser.
    - assets/legal/

# flutter_launcher_icons is not a declared dependency, so this block is inert
# today. It is kept accurate for whoever installs the package later. The working
# generator is docs/brand/detox-icon/aplicar_al_proyecto.py, which also writes
# the adaptive icon XML and the splash assets.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/detox_logo.png
  adaptive_icon_foreground: assets/images/detox_symbolo_oscuro.png
  adaptive_icon_monochrome: assets/images/detox_symbolo_oscuro.png
  adaptive_icon_background: '#0B110F'
